name: Deploy to Cloud Run

on:
  push:
    branches: [main]

env:
  REGION: us-central1
  SERVICE: japanese-phrase-card-creatrix
  REPOSITORY: apps # shared Artifact Registry repo, see organisatrix/infra
  # Set these in this repo's Settings -> Secrets and variables -> Actions ->
  # Variables (see organisatrix/infra/README.md step 4). Keeping them out of
  # this file means the project ID isn't sitting in the repo's source.
  PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
  WORKLOAD_IDENTITY_PROVIDER: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
  # Used to authenticate the GitHub Actions build/deploy calls -- has
  # run.admin/artifactregistry.writer/iam.serviceAccountUser, none of
  # which the running app itself needs.
  SERVICE_ACCOUNT: ${{ vars.GCP_SERVICE_ACCOUNT }}
  # The container's own identity at runtime -- a separate, narrower
  # account carrying only roles/aiplatform.user, so the deployed app
  # can't do anything with the deploy account's broader permissions
  # even if it were ever compromised.
  RUNTIME_SERVICE_ACCOUNT: ${{ vars.GCP_RUNTIME_SERVICE_ACCOUNT }}

permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ env.WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ env.SERVICE_ACCOUNT }}

      - uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker ${{ env.REGION }}-docker.pkg.dev

      - name: Build and push image
        run: |
          IMAGE="${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/${{ env.SERVICE }}:${{ github.sha }}"
          docker build -t "$IMAGE" .
          docker push "$IMAGE"
          echo "IMAGE=$IMAGE" >> "$GITHUB_ENV"

      - name: Deploy to Cloud Run
        uses: google-github-actions/deploy-cloudrun@v2
        with:
          service: ${{ env.SERVICE }}
          region: ${{ env.REGION }}
          image: ${{ env.IMAGE }}
          # Without this, Cloud Run runs the container as the project's
          # default compute service account on first deploy -- not
          # something scoped to what this app actually needs. This is
          # deliberately RUNTIME_SERVICE_ACCOUNT, not the deploy SA above:
          # the deploy SA's run.admin/artifactregistry.writer/
          # serviceAccountUser roles are for the GitHub Actions build/
          # deploy step, not something the running container should carry
          # around too.
          service_account: ${{ env.RUNTIME_SERVICE_ACCOUNT }}
          env_vars: |
            CARD_BACKEND=gemini
            GOOGLE_GENAI_USE_ENTERPRISE=true
            GOOGLE_CLOUD_PROJECT=${{ env.PROJECT_ID }}
            GOOGLE_CLOUD_LOCATION=global
            APP_ACCESS_CODE=${{ secrets.APP_ACCESS_CODE }}
          # Public (allUsers) invocation still needs a real access code
          # (main.py rejects requests without it, before any Gemini call
          # happens) -- this cap is a hard backstop on top of that, so
          # even a leaked code can't scale past a few concurrent
          # instances worth of billed calls.
          flags: --max-instances=3
