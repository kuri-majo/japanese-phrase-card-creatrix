name: Deploy to Cloud Run

on:
  push:
    branches: [main]

env:
  REGION: europe-west6
  SERVICE: japanese-phrase-card-creatrix
  REPOSITORY: apps # shared Artifact Registry repo, see organisatrix/infra
  # Set these in this repo's Settings -> Secrets and variables -> Actions ->
  # Variables (see organisatrix/infra/README.md step 4). Keeping them out of
  # this file means the project ID isn't sitting in the repo's source.
  PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
  WORKLOAD_IDENTITY_PROVIDER: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
  # Used to authenticate the GitHub Actions build/deploy calls -- has
  # run.admin/artifactregistry.writer/iam.serviceAccountUser, none of
  # which the running app itself needs.
  SERVICE_ACCOUNT: ${{ vars.GCP_SERVICE_ACCOUNT }}
  # The container's own identity at runtime -- a separate, narrower
  # account carrying only roles/aiplatform.user and roles/datastore.user
  # (see AGENTS.md), so the deployed app can't do anything with the
  # deploy account's broader permissions even if it were ever compromised.
  RUNTIME_SERVICE_ACCOUNT: ${{ vars.GCP_RUNTIME_SERVICE_ACCOUNT }}

permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ env.WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ env.SERVICE_ACCOUNT }}

      - uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker ${{ env.REGION }}-docker.pkg.dev

      - name: Build and push image
        run: |
          IMAGE="${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/${{ env.SERVICE }}:${{ github.sha }}"
          docker build -t "$IMAGE" .
          docker push "$IMAGE"
          echo "IMAGE=$IMAGE" >> "$GITHUB_ENV"

      - name: Deploy to Cloud Run
        uses: google-github-actions/deploy-cloudrun@v2
        with:
          service: ${{ env.SERVICE }}
          region: ${{ env.REGION }}
          image: ${{ env.IMAGE }}
          env_vars: |
            CARD_BACKEND=gemini
            GOOGLE_GENAI_USE_ENTERPRISE=true
            GOOGLE_CLOUD_PROJECT=${{ env.PROJECT_ID }}
            GOOGLE_CLOUD_LOCATION=global
            CARD_STORE=firestore
            ZITADEL_DOMAIN=${{ vars.ZITADEL_DOMAIN }}
            ZITADEL_CLIENT_ID=${{ vars.ZITADEL_CLIENT_ID }}
            ZITADEL_PROJECT_ID=${{ vars.ZITADEL_PROJECT_ID }}
            APP_BASE_URL=${{ vars.APP_BASE_URL }}
            ZITADEL_CLIENT_SECRET=${{ secrets.ZITADEL_CLIENT_SECRET }}
            FLASK_SECRET_KEY=${{ secrets.FLASK_SECRET_KEY }}
          # deploy-cloudrun@v2 has NO service_account input (confirmed
          # against the action's own action.yml -- an earlier version of
          # this file used one anyway, which GitHub Actions silently
          # ignored as an unknown `with:` key, so the container kept
          # running as the default compute SA despite this file looking
          # correct). --service-account is a real `gcloud run deploy`
          # flag though, so it has to go through `flags` instead. Without
          # it the container defaults to the project's default compute
          # SA, not RUNTIME_SERVICE_ACCOUNT (a separate, narrower account
          # carrying only roles/aiplatform.user and roles/datastore.user
          # -- the deploy SA above has broader roles the running
          # container doesn't need).
          # --max-instances is a backstop on top of the ZITADEL login +
          # per-user approval gate in main.py/auth.py: even a compromised
          # account can't scale past a few concurrent instances worth of
          # billed calls.
          flags: --service-account=${{ env.RUNTIME_SERVICE_ACCOUNT }} --max-instances=3
